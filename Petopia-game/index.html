<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Petopia Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TOP RESOURCE BAR -->
    <div class="top-bar">
        <div class="resource-card">
            <span class="resource-icon">🪙</span>
            <span class="resource-value" id="coins-display">0</span>
        </div>
    </div>

    <!-- TAB 1: HOME -->
    <div id="tab-home" class="tab-content active">
        <div class="header">
            <h1 class="title">PETOPIA 🐾</h1>
            <div class="subtitle" id="status-subtitle">Tap the egg to unlock your first pet!</div>
            
            <div class="counter-card" id="counter-card">
                <div class="counter-text" id="counter-label">Tutorial Progress</div>
                <div class="counter-value"><span id="clicks">0</span> / <span id="target">10</span></div>
            </div>
        </div>

        <div class="game-area">
            <div class="egg-wrapper" id="main-interactive-btn">
                <img src="img/eggs/egg.png" id="main-img" class="egg-img" alt="Petopia Interactive">
            </div>
        </div>
    </div>

    <!-- TAB 2: COLLECTION -->
    <div id="tab-collection" class="tab-content">
        <h2>Your Pets 🎒</h2>
        <div class="collection-grid" id="collection-grid">
            <!-- Dynamically populated via JS -->
        </div>
    </div>

    <!-- TAB 3: SHOP -->
    <div id="tab-shop" class="tab-content">
        <h2>Shop 🛒</h2>
        <div class="shop-list">
            <div class="shop-item">
                <img src="img/eggs/egg.png" alt="Common Egg">
                <div class="shop-info">
                    <h3>Common Egg</h3>
                    <p>Requires: 50 taps</p>
                </div>
                <button class="buy-btn" id="buy-egg-btn">100 🪙</button>
            </div>
        </div>
    </div>

    <!-- TAB 4: MISSIONS (NOWA ZAKŁADKA) -->
    <div id="tab-missions" class="tab-content">
        <h2>Missions 🎯</h2>
        <div class="missions-list">
            
            <div class="mission-item">
                <div class="mission-info">
                    <h3>First Steps</h3>
                    <p>Hatch your starter pet</p>
                    <span class="reward-tag">+50 🪙</span>
                </div>
                <button class="claim-mission-btn" id="m1-btn">CLAIM</button>
            </div>

            <div class="mission-item">
                <div class="mission-info">
                    <h3>Tap Master</h3>
                    <p>Reach 50 total taps</p>
                    <span class="reward-tag">+100 🪙</span>
                </div>
                <button class="claim-mission-btn disabled" id="m2-btn">0 / 50</button>
            </div>

        </div>
    </div>

    <!-- REWARD MODAL -->
    <div class="reward-modal" id="reward-modal">
        <div class="modal-card">
            <img src="img/pets/slime.png" class="pet-img" alt="Starter Slime">
            <div class="pet-name">Starter Slime</div>
            <div class="badge">STARTER PET</div>
            <div class="pet-stats">⚡ Value: +1 Coin / tap</div>
            <button class="claim-btn" id="claim-btn">CLAIM PET</button>
        </div>
    </div>

    <!-- BOTTOM NAVBAR (DODANA IKONA MISSIONS) -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-tab="tab-home">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-btn" data-tab="tab-collection">
            <span class="nav-icon">🎒</span>
            <span class="nav-label">Pets</span>
        </button>
        <button class="nav-btn" data-tab="tab-shop">
            <span class="nav-icon">🛒</span>
            <span class="nav-label">Shop</span>
        </button>
        <button class="nav-btn" data-tab="tab-missions">
            <span class="nav-icon">🎯</span>
            <span class="nav-label">Missions</span>
        </button>
    </nav>

    <!-- JS -->
    <script src="script.js"></script>
</body>
</html>
