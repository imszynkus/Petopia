<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Petopia Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- DAILY SPIN FLOATING BADGE -->
    <div id="spin-badge-btn" class="spin-floating-badge">
        <img src="img/roulette.png" alt="Daily Spin" class="spin-icon-img">
        <span id="spin-badge-timer" class="spin-badge-timer">READY!</span>
    </div>

    <!-- WHEEL OF FORTUNE MODAL (6 DEDICATED SECTIONS) -->
    <div id="spin-modal" class="reward-modal" style="display: none;">
        <div class="modal-card spin-modal-card">
            <button id="close-spin-btn" class="close-modal-btn">✕</button>
            <h3>Daily Spin 🎰</h3>
            <p id="spin-timer-text">Spin the wheel to win free rewards!</p>
            
            <div class="wheel-outer-container">
                <div class="wheel-arrow">▼</div>
                
                <div id="wheel" class="wheel-spinner">
                    <!-- Section 0: Legendary Egg -->
                    <div class="wheel-slice" style="--i:0; --clr:#f1c40f;"><span>🌟 Legend</span></div>
                    <!-- Section 1: 1000 Coins -->
                    <div class="wheel-slice" style="--i:1; --clr:#2ecc71;"><span>1000 <img src="img/coin.png" class="coin-icon" alt="Coin"></span></div>
                    <!-- Section 2: Rare Egg -->
                    <div class="wheel-slice" style="--i:2; --clr:#3498db;"><span>🥚 Rare</span></div>
                    <!-- Section 3: 250 Coins -->
                    <div class="wheel-slice" style="--i:3; --clr:#e67e22;"><span>250 <img src="img/coin.png" class="coin-icon" alt="Coin"></span></div>
                    <!-- Section 4: +1 Refill -->
                    <div class="wheel-slice" style="--i:4; --clr:#9b59b6;"><span>⚡ +1 Refill</span></div>
                    <!-- Section 5: 50 Coins -->
                    <div class="wheel-slice" style="--i:5; --clr:#e74c3c;"><span>50 <img src="img/coin.png" class="coin-icon" alt="Coin"></span></div>
                </div>
                
                <div class="wheel-center-cap">★</div>
            </div>

            <button id="spin-btn" class="action-btn spin-action-btn">SPIN!</button>
        </div>
    </div>
    
    <!-- MAIN TOP BAR WITH COINS -->
    <div class="top-bar">
        <div class="resource-card" id="coins-display">
            <img src="img/coin.png" class="coin-icon" alt="Coin">
            <span class="resource-value" id="coins-value">0</span>
        </div>
    </div>

    <!-- DYNAMIC TABS CONTAINER -->
    <div id="tab-home" class="tab-content active"></div>
    <div id="tab-collection" class="tab-content"></div>
    <div id="tab-shop" class="tab-content"></div>
    <div id="tab-upgrades" class="tab-content"></div>
    <div id="tab-missions" class="tab-content"></div>

    <!-- REWARD MODAL -->
    <div class="reward-modal" id="reward-modal" style="display: none;">
        <div class="modal-card">
            <img src="img/pets/slime.png" class="pet-img" alt="Starter Slime">
            <div class="pet-name">Starter Slime</div>
            <div class="badge">STARTER PET</div>
            <div class="pet-stats">⚡ Value: +1 Coin / tap</div>
            <button class="claim-btn" id="claim-btn">CLAIM PET</button>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-tab="tab-home">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-btn" data-tab="tab-collection">
            <span class="nav-icon">🎒</span>
            <span class="nav-label">Pets</span>
        </button>
        <button class="nav-btn" data-tab="tab-shop">
            <span class="nav-icon">🛒</span>
            <span class="nav-label">Shop</span>
        </button>
        <button class="nav-btn" data-tab="tab-upgrades">
            <span class="nav-icon">⚡</span>
            <span class="nav-label">Upgrades</span>
        </button>
        <button class="nav-btn" data-tab="tab-missions">
            <span class="nav-icon">🎯</span>
            <span class="nav-label">Missions</span>
        </button>
    </nav>
    
    <div id="hatch-reward-modal" class="hatch-reward-modal">
        <div class="hatch-reward-content">
            <div class="hatch-reward-title">New Pet Hatched! 🎉</div>
            <img id="hatch-reward-img" src="" alt="Pet">
            <div style="color: white; font-size: 1.3em; font-weight: bold;" id="hatch-reward-name">Pet Name</div>
            <button class="hatch-reward-btn" onclick="closeHatchReward()">Awesome!</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
