<div class="upgrades-view">
    <h2>⚡ Energy Upgrades</h2>
    <p class="upgrades-subtitle">Boost your energy capacity and recharge rate!</p>

    <div class="upgrades-list">
        <!-- Upgrade 1: Max Energy -->
        <div class="upgrade-card">
            <div class="upgrade-info">
                <h4>Capacity Limit</h4>
                <p>Increase max energy capacity</p>
                <span id="upgrade-max-energy-stats" class="upgrade-stats">+200 ⚡ (Current: 1000)</span>
            </div>
            <button id="buy-max-energy-btn" class="buy-upgrade-btn">
                <span id="cost-max-energy">150</span> <img src="img/coin.png" class="coin-icon" alt="coin">
            </button>
        </div>

        <!-- Upgrade 2: Recharge Speed -->
        <div class="upgrade-card">
            <div class="upgrade-info">
                <h4>Recharge Speed</h4>
                <p>Regenerate energy faster</p>
                <span id="upgrade-regen-rate-stats" class="upgrade-stats">+1 ⚡/s (Current: 1/s)</span>
            </div>
            <button id="buy-regen-speed-btn" class="buy-upgrade-btn">
                <span id="cost-regen-speed">200</span> <img src="img/coin.png" class="coin-icon" alt="coin">
            </button>
        </div>
    </div>
</div>
