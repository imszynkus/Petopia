<div class="main-area">
    <!-- ŚRODKOWY LICZNIK (+2 🪙 / tap LUB HATCHING PROGRESS) -->
    <div class="counter-box">
        <div id="counter-label" class="counter-label">HATCHING PROGRESS</div>
        <div class="counter-value">
            <span id="clicks">0</span>
        </div>
    </div>

    <!-- POWIĘKSZONY OBSZAR KLIKANIA (ZWIERZAK / JAJKO) -->
    <div id="click-area" class="click-area">
        <img id="main-img" src="img/eggs/egg.png" alt="Pet or Egg" class="clickable-pet">
    </div>

    <!-- PASEK ENERGII -->
    <div class="energy-container">
        <div class="energy-info">
            <span>⚡ Energy</span>
            <span id="energy-text">1000 / 1000</span>
        </div>
        <div class="energy-bar-bg">
            <div id="energy-bar-fill" class="energy-bar-fill" style="width: 100%;"></div>
        </div>
    </div>
</div>
